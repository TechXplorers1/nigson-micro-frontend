<footer class="mt-24 border-t border-border bg-ink text-background">
  <div class="container-page grid gap-12 py-16 lg:grid-cols-[minmax(0,1.2fr)_minmax(0,3fr)] lg:gap-16">
    <!-- Branding -->
    <div class="space-y-4">
      <a routerLink="/" class="flex items-center">
        <img src="/assets/logo.png" alt="Nigson Group" class="w-32 md:w-40 h-auto object-contain brightness-0 invert -ml-2" />
      </a>
      <p class="max-w-xs text-sm text-background/70">
        Building Value. Delivering Excellence. Creating Lasting Impact.
      </p>
      <div class="flex gap-3 pt-2">
        <a href="https://tinyurl.com/nigson-instagram" aria-label="Instagram" class="rounded-full border border-background/20 p-2 transition-colors hover:border-brand hover:bg-brand">
          <span>IG</span>
        </a>
        <a href="https://tinyurl.com/nigson-facebook" aria-label="Facebook" class="rounded-full border border-background/20 p-2 transition-colors hover:border-brand hover:bg-brand">
          <span>FB</span>
        </a>
        <a href="https://tinyurl.com/Nigson-youtube" aria-label="YouTube" class="rounded-full border border-background/20 p-2 transition-colors hover:border-brand hover:bg-brand">
          <span>YT</span>
        </a>
        <a href="https://tinyurl.com/nigson-tiktok" aria-label="TikTok" class="rounded-full border border-background/20 p-2 transition-colors hover:border-brand hover:bg-brand">
          <svg viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4" aria-hidden="true">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z" />
          </svg>
        </a>
      </div>
    </div>

    <!-- 5-column navigation -->
    <div class="grid grid-cols-2 gap-x-8 gap-y-10 sm:grid-cols-3 lg:grid-cols-5">
      <nav *ngFor="let col of COLUMNS" [attr.aria-label]="col.heading">
        <h4 class="mb-4 text-sm font-semibold uppercase tracking-wider text-background">{{ col.heading }}</h4>
        <ul class="space-y-2.5">
          <li *ngFor="let link of col.links">
            <ng-container *ngIf="link.href; else routerLinkNode">
              <a [href]="link.href" target="_blank" rel="noopener noreferrer" class="block text-sm text-background/70 transition-colors hover:text-brand">
                {{ link.label }}
              </a>
            </ng-container>
            <ng-template #routerLinkNode>
              <a [routerLink]="link.to" class="block text-sm text-background/70 transition-colors hover:text-brand">
                {{ link.label }}
              </a>
            </ng-template>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="border-t border-background/10">
    <div class="container-page grid grid-cols-1 items-center justify-between gap-3 py-6 text-xs text-background/50 md:grid-cols-3">
      <p class="text-center md:text-left">© {{ currentYear }} Nigson Group of Companies. All rights reserved.</p>
      <p class="text-center">
        Develop & Design By
        <a
          href="https://techxplorers.in/"
          target="_blank"
          rel="noopener noreferrer"
          class="transition-colors hover:text-background underline underline-offset-2"
        >
          Techxplorers Pvt. Ltd
        </a>
      </p>
      <p class="text-center md:text-right">Innovation • Quality • Trust</p>
    </div>
  </div>
</footer>
