<!-- Hero Section -->
<section class="relative overflow-hidden bg-white md:h-[600px] lg:h-[640px]">
  <div class="absolute inset-y-0 right-0 hidden w-[61%] overflow-hidden bg-brand/5 [clip-path:polygon(18%_0,100%_0,100%_100%,0_100%)] md:block">
    <img
      src="/assets/home-hero-products.jpg"
      alt="Nigson earbuds, power bank, charger and charging cable"
      width="1200"
      height="900"
      class="h-full w-full object-cover"
    />
    <div class="absolute right-[13%] top-[10%] grid h-20 w-20 place-items-center rounded-full bg-brand text-center text-white shadow-elegant lg:h-24 lg:w-24">
      <span class="text-2xl font-extrabold leading-none lg:text-3xl">40%<small class="mt-1 block text-[10px] font-bold uppercase">Off</small></span>
    </div>
  </div>

  <div class="relative z-10 grid w-full px-6 md:h-full md:grid-cols-[44%_56%] md:px-[7%]">
    <div class="flex flex-col justify-center py-14 md:py-10">
      <p class="mb-6 w-fit border-l-[3px] border-brand bg-brand/10 px-3 py-2 text-[10px] font-bold uppercase tracking-[0.14em] text-brand">
        UP TO 40% OFF
      </p>
      <h1 class="text-[44px] font-extrabold leading-[0.98] text-ink sm:text-6xl lg:text-[80px]">
        POWER YOUR<br />
        <span class="text-brand">EVERYDAY.</span>
      </h1>
      <p class="mt-7 max-w-[520px] text-base leading-8 text-muted-ink lg:text-lg">
        Discover smarter tech, powerful accessories and everyday essentials at prices you’ll love.
      </p>
      <div class="mt-8 flex flex-wrap gap-3">
        <a
          routerLink="/shop/products"
          class="inline-flex h-14 items-center gap-3 rounded-md bg-brand px-7 text-sm font-bold text-white shadow-brand transition-colors hover:bg-brand-deep"
        >
          SHOP NOW <svg lucideArrowRight class="h-5 w-5"></svg>
        </a>
        <a
          routerLink="/shop/products"
          class="inline-flex h-14 items-center rounded-md border border-ink bg-white px-7 text-sm font-bold text-ink transition-colors hover:border-brand hover:text-brand"
        >
          EXPLORE DEALS
        </a>
      </div>
      <div class="mt-8 flex flex-wrap items-center gap-x-8 gap-y-3 text-xs font-medium text-muted-ink">
        <span class="flex items-center gap-2"><svg lucideShieldCheck class="h-4 w-4 text-brand"></svg> Genuine products</span>
        <span class="flex items-center gap-2"><svg lucideTruck class="h-4 w-4 text-brand"></svg> Fast nationwide delivery</span>
      </div>
    </div>

    <div class="relative -mx-6 aspect-[4/3] overflow-hidden bg-brand/5 md:hidden">
      <img
        src="/assets/home-hero-products.jpg"
        alt="Nigson earbuds, power bank, charger and charging cable"
        width="1200"
        height="900"
        class="h-full w-full object-cover"
      />
      <div class="absolute right-5 top-5 grid h-20 w-20 place-items-center rounded-full bg-brand text-center text-white shadow-elegant">
        <span class="text-2xl font-extrabold leading-none">40%<small class="mt-1 block text-[10px] font-bold uppercase">Off</small></span>
      </div>
    </div>
  </div>
</section>

<!-- Shop by Category Section -->
<section class="bg-white py-14 md:py-16">
  <div class="container-page">
    <div class="mb-8 flex items-start justify-between gap-6 reveal-on-scroll">
      <div>
        <h2 class="text-2xl md:text-[26px] font-extrabold uppercase tracking-[-0.02em]">
          Shop by Category
        </h2>
        <p class="mt-1.5 text-sm text-muted-foreground">Everything you need, all in one place.</p>
      </div>
      <a
        routerLink="/shop/products"
        class="inline-flex shrink-0 items-center gap-1.5 pt-1 text-sm font-semibold text-ink transition-colors hover:text-brand"
      >
        View all <svg lucideArrowRight class="h-4 w-4"></svg>
      </a>
    </div>

    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:gap-5 lg:grid-cols-9">
      <a
        *ngFor="let c of SHOP_CATEGORIES"
        routerLink="/shop/products"
        [queryParams]="{category: c.filter}"
        class="reveal-on-scroll group block text-center"
      >
        <div class="relative aspect-square overflow-hidden rounded-2xl border border-border bg-[#f6f6f6] transition-colors group-hover:border-brand">
          <img
            [src]="c.img"
            [alt]="c.name"
            loading="lazy"
            width="640"
            height="640"
            class="absolute inset-0 h-full w-full object-cover"
          />
        </div>
        <p class="mt-2.5 text-xs font-semibold text-ink transition-colors group-hover:text-brand md:text-[13px]">
          {{ c.name }}
        </p>
      </a>
    </div>
  </div>
</section>

<app-best-sellers></app-best-sellers>
